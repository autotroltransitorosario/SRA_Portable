<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>SRA Simulador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<style>
/* Concepto: consola operativa. Barra superior fija con las acciones del sistema, tablero de estados que filtra,
   lista/mapa/eventos al centro y ficha del reclamo como panel lateral con el próximo evento permitido. */
:root{
  --bg:#F4F5F8; --surface:#FFFFFF; --soft:#ECEEF3; --line:#DADEE6; --fg:#1B2333; --muted:#5A6477;
  --focus:#2F6FDE;
  --red:#B93A2E; --red-fg:#FFFFFF; --navy:#1A2A4A; --navy-fg:#FFFFFF;
  --orange:#EB6D12; --orange-fg:#2B1400;
  --amber-bg:#FBEBC8; --amber-fg:#7A5A10;
  --slate-bg:#E4E9F5; --slate-fg:#445478;
  --green-bg:#D9F0E3; --green-fg:#1F6B42;
  --gray-bg:#E6E8EE; --gray-fg:#4B5567;
  --warn-bg:#FFF4D6; --warn-fg:#6B4A00; --err-bg:#FDE8E6; --err-fg:#8A2118;
  --shadow:0 10px 30px rgba(20,30,50,.18);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E121A; --surface:#161B26; --soft:#1F2633; --line:#2A3345; --fg:#E8EBF2; --muted:#9BA5B9;
  --focus:#7BA6F5; --red:#C9473A; --navy:#2F4A80; --orange-fg:#1F0F00;
  --amber-bg:#4A3B14; --amber-fg:#F5D98F; --slate-bg:#2B3553; --slate-fg:#BFCBEC;
  --green-bg:#1F4533; --green-fg:#9DE3BF; --gray-bg:#2A3140; --gray-fg:#B2BBCC;
  --warn-bg:#4A3A12; --warn-fg:#F5D98F; --err-bg:#4A2220; --err-fg:#FFB4AB; --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E121A; --surface:#161B26; --soft:#1F2633; --line:#2A3345; --fg:#E8EBF2; --muted:#9BA5B9;
  --focus:#7BA6F5; --red:#C9473A; --navy:#2F4A80; --orange-fg:#1F0F00;
  --amber-bg:#4A3B14; --amber-fg:#F5D98F; --slate-bg:#2B3553; --slate-fg:#BFCBEC;
  --green-bg:#1F4533; --green-fg:#9DE3BF; --gray-bg:#2A3140; --gray-fg:#B2BBCC;
  --warn-bg:#4A3A12; --warn-fg:#F5D98F; --err-bg:#4A2220; --err-fg:#FFB4AB; --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--font);padding-left:0;padding-right:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* barra superior */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo-at{display:block;height:38px;width:auto;background:#fff;border-radius:8px;padding:4px 8px;box-sizing:content-box;border:1px solid var(--line)}
.logo{font:700 15px var(--display);letter-spacing:.06em;background:var(--navy);color:var(--navy-fg);border-radius:8px;padding:8px 10px}
.brand h1{margin:0;font:700 17px/1.2 var(--display)}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.top-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:3px;gap:2px}
.seg label,.seg button{position:relative;cursor:pointer;border:0;background:transparent;border-radius:7px;padding:6px 11px;font-weight:600;font-size:13px;color:var(--muted);min-height:32px;display:inline-flex;align-items:center}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg label:has(input:checked),.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg label:has(input:focus-visible){outline:2px solid var(--focus)}
.role-wrap{display:flex;align-items:center;gap:8px}
.role-wrap span{font-size:12px;color:var(--muted);font-weight:600}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-red{background:var(--red);border-color:var(--red);color:var(--red-fg)}
.btn-red:hover{background:var(--red);filter:brightness(1.1)}
.btn-navy{background:var(--navy);border-color:var(--navy);color:var(--navy-fg)}
.btn-navy:hover{background:var(--navy);filter:brightness(1.2)}
.btn-orange{background:var(--orange);border-color:var(--orange);color:var(--orange-fg);border-radius:999px;font-size:15px;font-weight:700;letter-spacing:.02em}
.btn-orange:hover{background:var(--orange);filter:brightness(1.07)}
.btn-sm{min-height:32px;padding:4px 10px;font-size:13px}
.link{background:none;border:0;padding:0;color:inherit;font-weight:700;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.link:hover{text-decoration-color:currentColor}
.btn-link{background:none;border:0;color:inherit;text-decoration:underline;font-weight:700;cursor:pointer;padding:4px 6px}
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;z-index:40;display:flex;flex-direction:column}
.menu-pop button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.menu-pop button:hover{background:var(--soft)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}

/* pills de estado: mismos colores que el mapa del reclamo */
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:3px 11px;font-weight:600;font-size:12px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.pill[data-tone="amber"]{background:var(--amber-bg);color:var(--amber-fg)}
.pill[data-tone="slate"]{background:var(--slate-bg);color:var(--slate-fg)}
.pill[data-tone="green"]{background:var(--green-bg);color:var(--green-fg)}
.pill[data-tone="gray"]{background:var(--gray-bg);color:var(--gray-fg)}
.pill[data-tone="orange"]{background:var(--orange);color:var(--orange-fg);font-weight:700}
.pill.lg{font-size:16px;padding:7px 18px}

main{padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--muted);font-size:13px}
.status strong{color:var(--fg)}
.tag{display:inline-flex;align-items:center;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.tag-warn{background:var(--warn-bg);color:var(--warn-fg)}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-fg)}
.banner.err{background:var(--err-bg);color:var(--err-fg)}
.banner.info{background:var(--soft);color:var(--fg)}
.banner ul{margin:4px 0 0;padding-left:18px}
.banner .grow{flex:1 1 320px;min-width:0}

/* tablero */
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;min-width:0}
.card:hover{border-color:var(--muted)}
.card[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg) inset}
.card .n{font:700 30px/1 var(--display);font-variant-numeric:tabular-nums}
.card .k{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.card .lbl{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* barra de filtros */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar input[type=search],.toolbar select,.field input,.field select,.field textarea{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0;width:100%}
.toolbar .search{flex:1 1 280px}
.toolbar .calle{flex:0 1 190px}
.toolbar .calle input{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0;width:100%}
.toolbar select{flex:0 1 auto;width:auto;max-width:100%}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 6px;font-weight:500;cursor:pointer}
.chk input{width:18px;height:18px}
.spacer{flex:1 1 0}

/* tabla */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl-wrap{overflow:auto}
#view-lista .tbl-wrap{max-height:max(420px,calc(100vh - 260px))}
table{border-collapse:collapse;width:100%;min-width:1180px}
.th-sort{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;border-radius:4px}
.th-sort:hover{color:var(--fg)}
.th-sort:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.th-sort .ar{display:inline-flex;flex-direction:column;line-height:.8;font-size:9px;margin-left:2px}
.th-sort .ar b{opacity:.3;font-weight:400}
.th-sort .ar b.on{opacity:1;color:var(--focus)}
th[aria-sort] .th-sort{color:var(--fg)}
th[aria-sort]{background:color-mix(in srgb,var(--focus) 12%,var(--soft))}
td.coord{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:13px}
th{position:sticky;top:0;z-index:1;text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft);padding:9px 12px;white-space:nowrap;font-weight:600}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:color-mix(in srgb,var(--soft) 60%,transparent)}
tbody tr.is-sel{background:color-mix(in srgb,var(--amber-bg) 45%,transparent)}
tbody tr.is-open{box-shadow:inset 3px 0 0 var(--navy)}
.c-chk{width:36px}
.c-chk input{width:18px;height:18px;cursor:pointer}
td .sub{color:var(--muted);font-size:12.5px}
td.num,th.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{display:inline-block;min-width:24px;text-align:center;border-radius:999px;background:var(--soft);padding:1px 8px;font-weight:700;font-variant-numeric:tabular-nums}
.mod{margin-left:6px;font-size:11px;font-weight:600;color:var(--warn-fg);background:var(--warn-bg);border-radius:999px;padding:1px 7px}
.pager{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}

/* mapa */
.map-box{position:relative;isolation:isolate;aspect-ratio:277/170;width:min(100%,calc((100vh - 190px) * 277 / 170));min-width:min(100%,560px);margin:0 auto;background:var(--soft);touch-action:none}
#view-mapa #map-body{background:var(--soft)}
.lbl-pane{pointer-events:none}
.lbl-pane svg{position:absolute;overflow:visible}
.lbl-pane .mlb{position:absolute;white-space:nowrap;background:#fff;border:1px solid #0a2770;border-left-width:4px;border-radius:5px;padding:0 6px;font-family:Arial,Helvetica,sans-serif;font-weight:600;color:#122036;box-shadow:0 1px 4px rgba(0,0,0,.28);box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lbl-pane .mlb b{font-weight:700}
.lbl-pane .mlb.sel{border-color:#2F6FDE;background:#EAF1FD}
.lbl-pane .mlb.open{border-color:#000;background:#FFF7D6}
#map-svg{width:100%;height:100%;display:block;cursor:grab}
#map-svg:active{cursor:grabbing}
.dot{stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
.dot[data-tone="amber"]{fill:var(--amber-bg);stroke:var(--amber-fg)}
.dot[data-tone="slate"]{fill:var(--slate-bg);stroke:var(--slate-fg)}
.dot[data-tone="green"]{fill:var(--green-bg);stroke:var(--green-fg)}
.dot[data-tone="gray"]{fill:var(--gray-bg);stroke:var(--gray-fg)}
.dot.sel{stroke:var(--fg);stroke-width:3}
.map-tools{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.map-tools .btn{min-height:40px;min-width:40px;padding:0}
.map-scale{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--surface) 88%,transparent);padding:6px 10px;border-radius:8px}
.map-scale i{display:block;height:6px;border:2px solid var(--fg);border-top:0}
.map-note{position:absolute;left:12px;top:12px;max-width:60%;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:6px 10px;border-radius:8px}
.dot.chosen{stroke:var(--focus);stroke-width:3.5}
.map-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 12px;border-bottom:1px solid var(--line)}
.map-bar .info{color:var(--muted);font-size:13px}
.rad{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13.5px;background:color-mix(in srgb,#2F6FDE 10%,var(--surface));border:1px solid color-mix(in srgb,#2F6FDE 40%,var(--line));border-radius:10px;padding:3px 4px 3px 10px}
.rad input{width:84px;min-height:30px;border:1px solid var(--line);border-radius:7px;padding:3px 8px;background:var(--surface);font-variant-numeric:tabular-nums}
.rad-hint{flex-basis:100%;font-size:13px;color:var(--fg);background:color-mix(in srgb,#2F6FDE 9%,transparent);border-radius:8px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.leaflet-container.rad-mode{cursor:crosshair}
.switch{display:inline-flex;align-items:center;gap:10px;min-height:36px;cursor:pointer;font-weight:600;font-size:13.5px;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .trk{position:relative;width:40px;height:22px;border-radius:999px;background:var(--line);transition:background .15s;flex:none}
.switch .trk::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.switch input:checked+.trk{background:var(--navy)}
.switch input:checked+.trk::after{transform:translateX(18px)}
.switch input:focus-visible+.trk{outline:2px solid var(--focus);outline-offset:2px}
.switch input:disabled~*{opacity:.5;cursor:not-allowed}
#lmap{position:absolute;inset:0;background:var(--soft);font:inherit}
.leaflet-container{font:13px/1.4 var(--font)}
.leaflet-tooltip{font-size:12.5px}
.leaflet-tooltip.map-lbl{background:#fff;color:#14213D;border:1.5px solid #1A2A4A;border-left-width:4px;border-radius:4px;padding:1px 6px;font:600 11.5px/1.35 var(--font);box-shadow:0 1px 2px rgba(0,0,0,.25);white-space:nowrap}
.leaflet-tooltip.map-lbl::before{display:none}
.leaflet-tooltip.map-lbl.is-sel{border-color:#2F6FDE;background:#EAF1FD}
.leaflet-tooltip.map-lbl.is-open{border-color:#000;background:#FFF7D6}
.map-lbl.tone-amber{border-left-color:var(--amber-fg)}.map-lbl.tone-slate{border-left-color:var(--slate-fg)}.map-lbl.tone-green{border-left-color:var(--green-fg)}.map-lbl.tone-gray{border-left-color:var(--gray-fg)}
.print-only{display:none}
.print-head{padding:0 0 8px}
.print-head h2{margin:0;font:700 18px/1.2 var(--display)}
.print-head p{margin:2px 0 0;font-size:12px;color:#333}
/* listado de solicitudes para imprimir (mismo formato que "Listado con equipamiento") */
#print-report{font:10px/1.3 Arial,Helvetica,sans-serif;color:#000}
.rp-head{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:start;margin-bottom:8px}
.rp-head .l{font-weight:700;font-size:11px;line-height:1.55}
.rp-head .c{font-size:11px;line-height:1.55;padding-top:2px}
.rp-head .r{text-align:right}
.rp-head .r b{display:block;font-size:16px}
.rp-head .r span{font-weight:700;font-size:11px}
.rp-box{display:grid;grid-template-columns:1.1fr 1.2fr 1.2fr 1.2fr 1fr;background:#E9E9E9;border:2px solid #222;margin-bottom:10px}
.rp-box>div{padding:5px 7px 8px;border-left:1px solid #999}
.rp-box>div:first-child{border-left:0}
.rp-box small{display:block;font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.rp-box strong{display:block;font-size:12.5px;line-height:1.25;text-transform:uppercase}
table.rp{width:100%;min-width:0;border-collapse:collapse;table-layout:fixed}
table.rp th{position:static;background:#fff;color:#000;text-transform:none;letter-spacing:0;font-size:10px;font-weight:700;text-align:center;border:1px solid #444;padding:4px;white-space:normal}
table.rp td{border:1px solid #444;padding:3px 4px;vertical-align:top;font-size:9.5px;overflow-wrap:anywhere}
table.rp td.ctr{text-align:center}
table.rp tbody{break-inside:avoid}
table.rp tr.desc td{font-size:9.5px}
table.rp tbody tr:hover{background:none}
@media print{
  @page{size:A4 landscape;margin:10mm 10mm 14mm}
  body.print-report > :not(#print-report):not(main){display:none!important}
  body.print-report:not(.print-map) > main{display:none!important}
  body.print-report.print-map > main{break-before:page}
  body.print-report #print-report{display:block}
  body.print-map{background:#fff!important;color:#000}
  body.print-map::before,body.print-map .top,body.print-map #status,body.print-map #msgs,body.print-map #summary,body.print-map .toolbar,body.print-map #view-lista,body.print-map #view-eventos,body.print-map .map-bar,body.print-map #bulk,body.print-map #toast,body.print-map #drawer,body.print-map #scrim,body.print-map .leaflet-control-zoom,body.print-map #tile-note,body.print-map .map-tools,body.print-map .map-note{display:none!important}
  body.print-map main{padding:0!important;max-width:none}
  body.print-map #view-mapa{border:0;border-radius:0;overflow:visible}
  body.print-map #map-body{background:none}
  body.print-map #map-print-head{height:14mm;overflow:hidden;padding:0}
  body.print-map #map-print-head p{margin:0;font-size:9px}
  body.print-map #map-print-head h2{font-size:14px}
  body.print-map #map-print-head{display:block}
  body.print-map .map-box{width:var(--pw)!important;height:var(--ph)!important;min-width:0!important;aspect-ratio:auto;margin:0;zoom:var(--pz,1);border:1px solid #444;break-inside:avoid}
  body.print-map *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.clu{display:flex;align-items:center;justify-content:center;border-radius:50%;background:color-mix(in srgb,var(--navy) 88%,transparent);color:#fff;font:700 13px var(--font);border:3px solid rgba(255,255,255,.85);box-shadow:0 2px 6px rgba(0,0,0,.35);position:relative}
.clu.sel{border-color:#2F6FDE;box-shadow:0 0 0 3px rgba(47,111,222,.45),0 2px 6px rgba(0,0,0,.35)}
.clu small{position:absolute;top:-8px;right:-10px;background:#2F6FDE;color:#fff;border-radius:999px;padding:0 6px;font-size:11px;line-height:17px;border:2px solid #fff}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid}
.tip{position:absolute;pointer-events:none;background:var(--navy);color:var(--navy-fg);padding:6px 10px;border-radius:8px;font-size:12.5px;max-width:260px;z-index:5}

/* panel lateral */
.scrim{position:fixed;inset:0;background:rgba(10,16,28,.4);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:60;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px}
.dr-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dr-head h2{margin:0;font:700 22px/1.2 var(--display)}
.dr-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.sec h3{margin:0 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.state-box{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.state-box p{margin:0;color:var(--muted)}
.ev{display:flex;flex-direction:column;gap:6px;align-items:flex-start;margin-bottom:10px}
.ev .why{margin:0;font-size:12.5px;color:var(--muted)}
.ev .to{margin:0;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
dl.kv{display:grid;grid-template-columns:minmax(110px,150px) 1fr;gap:8px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.desc{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:10px 12px;margin:0;overflow-wrap:anywhere}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.hist .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;grid-column:2}
.hist .dotm{width:10px;height:10px;border-radius:50%;background:var(--navy);margin-top:6px}

/* barra masiva y avisos */
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:45;background:var(--navy);color:var(--navy-fg);border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:calc(100% - 32px)}
.bulk .btn{min-height:36px}
.bulk .btn-light{background:#fff;color:#1A2A4A;border-color:#fff}
.bulk .btn-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
#toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:90;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.dropveil{position:fixed;inset:0;z-index:100;background:color-mix(in srgb,var(--navy) 80%,transparent);color:#fff;display:flex;align-items:center;justify-content:center;font:700 26px var(--display);text-align:center;padding:24px}

/* diálogos */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);width:min(640px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,16,28,.5)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font:700 20px/1.25 var(--display)}
.dlg p{margin:0;color:var(--muted)}
.dlg-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lab{font-size:12.5px;font-weight:600}
.field small{color:var(--muted)}
.field textarea{min-height:84px;resize:vertical}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.opt:has(input:checked){border-color:var(--navy);background:var(--soft)}
.opt input{margin-top:3px;width:18px;height:18px}
.opt b{display:block}
.opt span{color:var(--muted);font-size:13px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow .arr{color:var(--muted)}
.errmsg{color:var(--err-fg);background:var(--err-bg);border-radius:10px;padding:8px 12px;font-weight:500}
.dup{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:10px 12px}
.dup ul{margin:6px 0;padding-left:18px}
.dup li{margin:6px 0}
.dup p{color:inherit}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.req{font-size:13px;color:var(--muted)}

@media (max-width:720px){
  .grid{grid-template-columns:1fr}
  .top-actions{width:100%}
  .brand p{display:none}
  dl.kv{grid-template-columns:1fr}
  dl.kv dt{margin-top:4px}
  .map-note{display:none}
}
@media (prefers-reduced-motion:no-preference){
  .drawer{animation:slidein .18s ease-out}
  @keyframes slidein{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
}
</style>

/* ───────── modelo SRA ───────── */

function buildRows(matrix) {
  const headers = (matrix[0] || []).map(h => String(h ?? '').trim());
  const hmap = {};

async function loadFile(file) {
  if (!file) return;
  if (S.rows.length && dirty() && !S.sample) {
    const ok = await ask('Hay cambios sin exportar', 'Si cargás otra planilla se pierden los eventos registrados en esta sesión. Exportá la tabla primero si querés conservarlos.', 'Cargar de todos modos');
    if (!ok) return;
  }
  try {
    let matrix, evMatrix = null;
    if (/\.(csv|txt)$/i.test(file.name)) {
      matrix = parseCSV((await file.text()).replace(/^﻿/, ''));
    } else {
      if (!window.XLSX) throw new Error('No se pudo cargar el lector de Excel. Revisá tu conexión o probá con un archivo .csv.');
      /* Las fechas se leen como número de serie y se convierten acá: cellDates de SheetJS corre los segundos según la zona horaria. */
      const wb = XLSX.read(await file.arrayBuffer(), {type: 'array', cellDates: false});
      const main = wb.SheetNames.find(n => norm(n) !== 'eventos') || wb.SheetNames[0];
      matrix = XLSX.utils.sheet_to_json(wb.Sheets[main], {header: 1, raw: true, defval: null, blankrows: false});
      const evName = wb.SheetNames.find(n => norm(n) === 'eventos');
      if (evName) evMatrix = XLSX.utils.sheet_to_json(wb.Sheets[evName], {header: 1, raw: true, defval: null, blankrows: false});
    }
    const built = buildRows(matrix);
    if (built.error) {
      showMsgs(`<div class="banner err" role="alert"><div class="grow"><strong>No se pudo cargar "${esc(file.name)}".</strong> Faltan columnas obligatorias:<ul>${built.error.map(c => `<li>${esc(c)}</li>`).join('')}</ul>Usá el mismo formato de la planilla de solicitudes o descargá la plantilla desde Exportar.</div></div>`);
      return;
    }
    if (!built.rows.length) { showMsgs(`<div class="banner err" role="alert">La planilla "${esc(file.name)}" no tiene filas con datos.</div>`); return; }
    installData(built, file.name, parseEvents(evMatrix), false);
    const w = built.warn, items = [];
    if (w.unknownState.size) items.push(`${w.unknownState.size} estado(s) no reconocido(s) (${[...w.unknownState].slice(0, 4).map(esc).join(', ')}). Esos reclamos se muestran sin acciones.`);
    if (w.badDate) items.push(`${w.badDate} fecha(s) con formato no reconocido.`);
    if (w.dupId) items.push(`${w.dupId} fila(s) con Id repetido.`);
    if (w.noCoord) items.push(`${w.noCoord} reclamo(s) sin coordenadas válidas, no aparecen en el mapa.`);
    showMsgs(`<div class="banner info"><div class="grow"><strong>Planilla cargada: ${fmtNum(built.rows.length)} reclamos.</strong> Los datos se procesan en este navegador y no se envían a ningún servidor.${items.length ? `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}</div><button class="btn btn-sm" type="button" data-dismiss>Entendido</button></div>`);
    populateFilters(); renderAll();
  } catch (e) {
    showMsgs(`<div class="banner err" role="alert">No se pudo leer el archivo: ${esc(e.message || e)}</div>`);
  }
}

    if (f.vecinal && r['Vecinal'] !== f.vecinal) return false;

/* Etiquetas "N.º · dirección" ubicadas automáticamente (misma lógica que el SRA en línea): para cada punto se prueban

const LBL_FS = 11;
let lblCtx = null;
function drawLabels() {
  const map = LM.map; if (!map || !map._loaded) return;
  const pane = map.getPane('lblPane'); if (!pane) return;
  pane.innerHTML = ''; pane.style.display = '';
  if (!S.labels || !LM.layer) return;
  const sz = map.getSize(), W = sz.x, H = sz.y, o = map.containerPointToLayerPoint([0, 0]);
  const useCl = S.cluster && hasCluster();
  const vis = [], obst = [];
  LM.layer.getLayers().forEach(m => {
    if (useCl && !map.hasLayer(m)) return;                           // dentro de un grupo: sin etiqueta
    const q = map.latLngToContainerPoint(m.getLatLng());
    if (q.x < -40 || q.y < -40 || q.x > W + 40 || q.y > H + 40) return;
    vis.push({m, x: q.x, y: q.y});
  });
  if (useCl && LM.layer._featureGroup) LM.layer._featureGroup.eachLayer(c => {   // los círculos de grupo son obstáculos
    if (!(c instanceof L.MarkerCluster)) return;
    const q = map.latLngToContainerPoint(c.getLatLng()); obst.push([q.x - 24, q.y - 24, q.x + 24, q.y + 24]);
  });

  lblCtx.font = `700 ${LBL_FS}px Arial,Helvetica,sans-serif`;
  const h = LBL_FS + 9;
  const items = vis.map(q => {
    const r = S.byUid.get(q.m._uid), num = '#' + (r['Número'] ?? ''), dir = addr(r) || 's/d';
    return {q, r, num, dir, w: Math.ceil(lblCtx.measureText(num + ' · ' + dir).width) + 16, h,
      pri: r._uid === S.open ? 2 : S.sel.has(r._uid) ? 1 : 0};
  }).sort((a, b) => b.pri - a.pri);
  const ov = (a, b) => Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])) * Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1]));
  const dots = vis.map(q => [q.x - 9, q.y - 9, q.x + 9, q.y + 9]).concat(obst);
  const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', W); svg.setAttribute('height', H); svg.style.left = o.x + 'px'; svg.style.top = o.y + 'px';
  const frag = document.createDocumentFragment(), placed = [];
  items.forEach(it => {
    const {w} = it, g = 11, cand = [[g, -h / 2], [-g - w, -h / 2], [-w / 2, -g - h], [-w / 2, g], [g, -g - h], [g, g], [-g - w, -g - h], [-g - w, g]];

    let best = null, bs = 1e18;
    for (let i = 0; i < cand.length; i++) {
      const R = [it.q.x + cand[i][0], it.q.y + cand[i][1], it.q.x + cand[i][0] + w, it.q.y + cand[i][1] + h];
      let sc = (w * h - ov(R, [0, 0, W, H])) * 3 + i * 0.01;           // fuera del recuadro
      for (const p of placed) { sc += ov(R, p) * 2; if (sc >= bs) break; } // sobre otras etiquetas
      if (sc < bs) for (const d of dots) { sc += ov(R, d); if (sc >= bs) break; } // sobre algún punto

    d.style.cssText = `left:${o.x + lx}px;top:${o.y + ly}px;width:${w}px;height:${h}px;line-height:${h - 2}px;font-size:${LBL_FS}px;border-left-color:${cssVar('--' + (TONE[it.r['Estado detallado']] || 'gray') + '-fg')}`;

  });

}

function mapMeasure() { const el = $('#map-svg'); if (!el) return; const b = el.getBoundingClientRect(); MAP.W = b.width || 800; MAP.H = b.height || 500; }

function mapApply() {
  const svg = $('#map-svg'); if (!svg) return;
  const w = MAP.W * MAP.mpp, h = MAP.H * MAP.mpp;
  svg.setAttribute('viewBox', `${MAP.cx - w / 2} ${MAP.cy - h / 2} ${w} ${h}`);
  svg.querySelectorAll('circle').forEach(c => c.setAttribute('r', (c.classList.contains('sel') ? 9 : 6.5) * MAP.mpp));
  const nice = [5,10,20,50,100,200,500,1000,2000,5000,10000].filter(n => n / MAP.mpp <= 130).pop() || 5;
  $('#scale-bar').style.width = (nice / MAP.mpp) + 'px';

}
function mapZoom(factor, px, py) {
  const wx = MAP.cx + (px - MAP.W / 2) * MAP.mpp, wy = MAP.cy + (py - MAP.H / 2) * MAP.mpp;

}
function bindMap() {
  const host = $('#view-mapa');
  host.addEventListener('wheel', e => { const s = e.target.closest('#map-svg'); if (!s) return; e.preventDefault(); const b = s.getBoundingClientRect(); mapZoom(e.deltaY < 0 ? 0.8 : 1.25, e.clientX - b.left, e.clientY - b.top); }, {passive: false});
  host.addEventListener('pointerdown', e => { const s = e.target.closest('#map-svg'); if (!s) return; MAP.drag = {x: e.clientX, y: e.clientY, cx: MAP.cx, cy: MAP.cy, moved: false, target: e.target}; s.setPointerCapture(e.pointerId); });
  host.addEventListener('pointermove', e => {
    const s = $('#map-svg'); if (!s) return;
    const d = MAP.drag;
    if (d) {
      const dx = e.clientX - d.x, dy = e.clientY - d.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) d.moved = true;
      if (d.moved) { MAP.moved = true; MAP.cx = d.cx - dx * MAP.mpp; MAP.cy = d.cy - dy * MAP.mpp; mapApply(); }
      return;
    }
    const c = e.target.closest && e.target.closest('circle.dot'), tip = $('#tip');
    if (c && tip) {
      const r = S.byUid.get(+c.dataset.uid), b = $('#map-box').getBoundingClientRect();
      tip.innerHTML = `<strong>#${esc(r['Número'])}</strong> · ${esc(r['Estado detallado'])}<br>${esc(addr(r))}`;
      tip.hidden = false; tip.style.left = Math.min(e.clientX - b.left + 14, b.width - 240) + 'px'; tip.style.top = (e.clientY - b.top + 14) + 'px';
    } else if (tip) tip.hidden = true;
  });
  host.addEventListener('pointerup', e => {

  host.addEventListener('click', e => {
    const z = e.target.closest('[data-zoom]'); if (!z) return;
    const v = +z.dataset.zoom;
    if (v === 0) mapFitAll(); else mapZoom(v > 0 ? 0.6 : 1.6, MAP.W / 2, MAP.H / 2);
  });
}

function applyEvent(r, ev, data, group) {
  const prev = {}; MUT.forEach(k => { prev[k] = r[k]; });
  const from = r['Estado detallado'], now = new Date(); let to = from, name = EV[ev].name, equipo = r['Último equipo asignado'];
  if (ev === 'asignar') { to = 'Asignado'; r['Tipo última intervención'] = 'En proceso'; r['Último equipo asignado'] = data.equipo; equipo = data.equipo; }
  else if (ev === 'resultado') { const o = OUTCOMES[data.outcome]; to = o.to; r['Tipo última intervención'] = o.tui; name = o.ev; }
  else if (ev === 'reparado') r['Tipo última intervención'] = 'Reparado';
  else if (ev === 'reposicion') r['Tipo última intervención'] = 'Reposición';
  r['Estado detallado'] = to; r['Estado'] = to === 'Cerrado' ? 'Cerrado' : 'En curso';
  const prevMod = !!r._mod; r._mod = true; r._hay = null;
  const log = {ts: now, id: r['Id'], numero: r['Número'], evento: name, de: from, a: to, equipo: equipo ?? '', rol: S.role, obs: data.obs || ''};
  S.events.push(log); group.push({uid: r._uid, prev, prevMod, log});
}
function commit(group) { S.undo.push({items: group}); S.rev++; }
function undoLast() {
  const g = S.undo.pop(); if (!g) return;
  g.items.forEach(it => {
    if (it.created) { S.rows = S.rows.filter(r => r._uid !== it.uid); S.byUid.delete(it.uid); S.sel.delete(it.uid); if (S.open === it.uid) S.open = null; }
    else { const r = S.byUid.get(it.uid); if (r) { Object.assign(r, it.prev); r._mod = it.prevMod; r._hay = null; } }
    const i = S.events.indexOf(it.log); if (i > -1) S.events.splice(i, 1);

  populateFilters(); renderAll();

      const b = e.target.closest('[data-reit]'); if (!b) return;
      const r = S.byUid.get(+b.dataset.reit), solic = Math.max(1, +$('#n-solic', d).value || 1);
      const prev = {}; MUT.forEach(k => { prev[k] = r[k]; }); const prevMod = !!r._mod;
      r['Reiteraciones'] = (Number(r['Reiteraciones']) || 0) + 1; r['Solicitantes'] = (Number(r['Solicitantes']) || 1) + solic; r._mod = true; r._hay = null;
      const log = {ts: new Date(), id: r['Id'], numero: r['Número'], evento: 'Reiteración', de: r['Estado detallado'], a: r['Estado detallado'], equipo: r['Último equipo asignado'] ?? '', rol: S.role, obs: ($('#n-desc', d).value || '').trim()};
      S.events.push(log); commit([{uid: r._uid, prev, prevMod, log}]);
      dlg.close(); renderAll(); openDrawer(r._uid); toast(`Reiteración sumada al reclamo #${r['Número']}`, true);
    });
    $('#nw-form', d).onsubmit = e => {
      e.preventDefault();
      const v = id => ($('#' + id, d).value || '').trim(), err = $('#n-err', d);
      const miss = [['n-calle', 'la calle'], ['n-altura', 'la altura'], ['n-desc', 'la descripción']].find(([id]) => !v(id));
      if (miss) { err.textContent = `Completá ${miss[1]} del reclamo.`; err.hidden = false; $('#' + miss[0], d).focus(); return; }
      const now = new Date(), nid = Math.max(0, ...S.rows.map(r => Number(r['Id']) || 0)) + 1, nnum = Math.max(0, ...S.rows.map(r => Number(r['Número']) || 0)) + 1;
      const r = {}; S.outCols.forEach(c => { r[c.key] = null; });
      const area = mode('Área derivación');
      Object.assign(r, {
        'Id': nid, 'Número': nnum, 'Año': now.getFullYear(), 'Tipo': mode('Tipo') || 'Reclamo', 'Subtipo': v('n-subtipo'), 'Categoría': mode('Categoría') || 'Alumbrado',
        'Fecha hora registro': now, 'Área origen': v('n-aorigen') || null, 'Área derivación': area, 'Estado': 'En curso', 'Estado detallado': 'En curso', 'Origen': v('n-origen'),
        'Distrito': v('n-distrito') || null, 'Vecinal': v('n-vecinal') || null, 'Ident. Barrio': v('n-barrio') || null, 'Reiteraciones': 0, 'Solicitantes': Math.max(1, +v('n-solic') || 1),
        'Fecha últ. derivación': now, 'Área última derivación': area, 'Calle': v('n-calle').toUpperCase(), 'Intersección': v('n-inter') || null, 'Altura': Number(v('n-altura')),
        'Bis': $('#n-bis', d).checked ? 'S' : 'N', 'Letra': v('n-letra').toUpperCase() || null, 'Descripción': v('n-desc')
      });
      r._uid = S.nextUid++; r._mod = true; r._new = true; r._x = r._y = null;
      S.rows.push(r); S.byUid.set(r._uid, r);
      const log = {ts: now, id: nid, numero: nnum, evento: 'Ingreso de reclamo', de: '', a: 'En curso', equipo: '', rol: S.role, obs: ''};
      S.events.push(log); commit([{uid: r._uid, created: true, log}]);
      S.f = {q: '', estado: '', subtipo: '', distrito: '', vecinal: '', calle: '', origen: '', equipo: '', reit: false}; $('#q').value = ''; $('#f-calle').value = ''; $('#f-reit').checked = false; S.sort = 'reg-desc'; $('#sort').value = 'reg-desc';
      dlg.close(); populateFilters(); renderAll(); openDrawer(r._uid); toast(`Reclamo #${nnum} ingresado en estado EN CURSO`, true);
    };
  });
}

/* ───────── exportación ───────── */
async function saveFile(filename, data, markSaved) {
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }
  if (!dl) { toast('Este visor no permite descargas. Abrí la página en el navegador.'); return; }
  try {
    await dl.save({filename, data});
    if (markSaved) { S.savedRev = S.rev; renderStatus(); }
    toast(`Archivo guardado: ${filename}`);
  } catch (e) {
    if (e && e.code === 'declined') return;
    toast(`No se pudo guardar el archivo (${(e && e.code) || 'error'}).`);
  }
}
const csvCell = v => { const s = isDate(v) ? fmtISO(v) : (v === null || v === undefined ? '' : String(v)); return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportData(kind) {
  const base = `${stamp()}_solicitudes`;
  if (kind === 'tpl') return saveFile('plantilla_solicitudes.csv', '﻿' + COLS.join(';') + '\r\n', false);
  if (!S.rows.length) return toast('No hay reclamos para exportar.');
  if (kind === 'csv') {
    const lines = [S.outCols.map(c => csvCell(c.header)).join(';')];
    S.rows.forEach(r => lines.push(S.outCols.map(c => csvCell(r[c.key])).join(';')));
    return saveFile(base + '.csv', '﻿' + lines.join('\r\n') + '\r\n', true);
  }
  if (!window.XLSX) return toast('No se pudo cargar el generador de Excel. Probá exportar en .csv.');
  /* Las fechas se escriben como número de serie de Excel (hora local sin zona) con formato de fecha. */
  const serial = d => (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours(), d.getMinutes(), d.getSeconds()) - Date.UTC(1899, 11, 30)) / 864e5;
  const cell = v => isDate(v) ? serial(v) : (v === undefined ? null : v);
  const fmtDates = (ws, cols) => Object.keys(ws).forEach(k => { if (k[0] !== '!' && ws[k].t === 'n' && cols.has(XLSX.utils.decode_cell(k).c) && XLSX.utils.decode_cell(k).r > 0) ws[k].z = 'yyyy-mm-dd hh:mm:ss'; });
  const aoa = [S.outCols.map(c => c.header)];
  S.rows.forEach(r => aoa.push(S.outCols.map(c => cell(r[c.key]))));
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  fmtDates(ws, new Set(S.outCols.map((c, i) => DATE_F.includes(c.key) ? i : -1).filter(i => i >= 0)));
  ws['!cols'] = S.outCols.map(c => ({wch: Math.min(40, Math.max(10, c.header.length + 2))}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, base.slice(0, 31));
  const ea = [EV_HEAD]; S.events.forEach(e => ea.push([cell(e.ts), e.id, e.numero, e.evento, e.de, e.a, e.equipo, e.rol, e.obs]));
  const we = XLSX.utils.aoa_to_sheet(ea);
  fmtDates(we, new Set([0]));
  we['!cols'] = [{wch: 20}, {wch: 12}, {wch: 10}, {wch: 22}, {wch: 14}, {wch: 14}, {wch: 18}, {wch: 12}, {wch: 50}];
  XLSX.utils.book_append_sheet(wb, we, 'Eventos');
  saveFile(base + '.xlsx', XLSX.write(wb, {bookType: 'xlsx', type: 'array'}), true);
}

/* ───────── render general y eventos de la interfaz ───────── */
function renderView() {
  ['lista', 'mapa', 'eventos'].forEach(v => { $('#view-' + v).hidden = S.view !== v; });
  $$('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === S.view)));
  if (S.view === 'lista') renderList(); else if (S.view === 'mapa') renderMap(); else renderEvents();
}
function renderAll() {
  renderStatus(); renderSummary(); renderView(); renderBulk(); if (S.open) { if (S.byUid.has(S.open)) renderDrawer(); else { S.open = null; renderDrawer(); } }
}
function refilter() { MAP.fit = true; renderSummary(); renderView(); renderBulk(); }

let qT;
$('#q').addEventListener('input', e => { clearTimeout(qT); qT = setTimeout(() => { S.f.q = e.target.value; refilter(); }, 150); });
let cT;
$('#f-calle').addEventListener('input', e => { clearTimeout(cT); cT = setTimeout(() => { S.f.calle = e.target.value; refilter(); }, 150); });
[['#f-subtipo', 'subtipo'], ['#f-distrito', 'distrito'], ['#f-vecinal', 'vecinal'], ['#f-origen', 'origen'], ['#f-equipo', 'equipo']].forEach(([id, k]) => $(id).addEventListener('change', e => { S.f[k] = e.target.value; refilter(); }));
$('#f-reit').addEventListener('change', e => { S.f.reit = e.target.checked; refilter(); });
$('#sort').addEventListener('change', e => setSort(e.target.value));
$('#views').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (!b) return; S.view = b.dataset.view; if (S.view === 'mapa') MAP.fit = true; renderView(); renderBulk(); });
$('#summary').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if (!b) return; const v = b.dataset.st; S.f.estado = S.f.estado === v ? '' : v; refilter(); });
$('#btn-print').addEventListener('click', () => {
  if (S.view !== 'mapa') { S.view = 'mapa'; MAP.fit = true; renderView(); renderBulk(); }
  setTimeout(printMap, hasLeaflet() ? 900 : 100); // da tiempo a que carguen el mapa base y las etiquetas
});
$('#btn-load').addEventListener('click', () => $('#file').click());
$('#file').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; loadFile(f); });
$('#menu').addEventListener('click', e => { const b = e.target.closest('[data-exp]'); if (b) { $('#menu').open = false; exportData(b.dataset.exp); } });
document.addEventListener('click', e => { const m = $('#menu'); if (m.open && !m.contains(e.target)) m.open = false; });
$('#status').addEventListener('click', e => { if (e.target.closest('#btn-undo')) undoLast(); const x = e.target.closest('[data-exp]'); if (x) exportData(x.dataset.exp); });
$('#msgs').addEventListener('click', e => { if (e.target.closest('[data-dismiss]')) showMsgs(''); if (e.target.closest('[data-load]')) $('#file').click(); });
$('#view-lista').addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) return openDrawer(+o.dataset.open, o);
  const so = e.target.closest('[data-sort]');
  if (so) {
    const k = so.dataset.sort, [ck, cd] = S.sort.split('-');
    const dir = ck === k ? (cd === 'asc' ? 'desc' : 'asc') : (SORT_STR.has(k) || k === 'estado' ? 'asc' : 'desc');
    setSort(`${k}-${dir}`); const b = $(`#view-lista [data-sort="${k}"]`); if (b) b.focus(); return;
  }
  if (e.target.closest('[data-selall]')) { filtered().forEach(r => S.sel.add(r._uid)); afterSel(); }
  if (e.target.closest('[data-selnone]')) { S.sel = new Set(); afterSel(); }
});
$('#view-lista').addEventListener('change', e => {
  if (e.target.id === 'sel-all') { const a = filtered(); if (e.target.checked) a.forEach(r => S.sel.add(r._uid)); else a.forEach(r => S.sel.delete(r._uid)); afterSel(); return; }
  const s = e.target.closest('[data-sel]');
  if (s) { const u = +s.dataset.sel; if (s.checked) S.sel.add(u); else S.sel.delete(u); s.closest('tr').classList.toggle('is-sel', s.checked); syncSelUI(); }
});
$('#view-eventos').addEventListener('click', e => { const o = e.target.closest('[data-open]'); if (o) openDrawer(+o.dataset.open, o); });
$('#drawer').addEventListener('click', e => {
  if (e.target.closest('#dr-sel') && S.open) { if (S.sel.has(S.open)) S.sel.delete(S.open); else S.sel.add(S.open); afterSel(); $('#dr-sel').focus(); return; }
  if (e.target.closest('#dr-close')) closeDrawer(); const b = e.target.closest('[data-ev]'); if (b && !b.disabled) openEvent(b.dataset.ev); });
$('#scrim').addEventListener('click', closeDrawer);
$('#bulk').addEventListener('click', e => {
  if (e.target.closest('#bulk-clear')) { S.sel = new Set(); afterSel(); }
  if (e.target.closest('#bulk-assign')) openBulkAssign();
  if (e.target.closest('#bulk-pdf')) openPrintSel();
  if (e.target.closest('#bulk-only')) { S.onlySel = !S.onlySel; MAP.fit = true; renderMap(); renderBulk(); }
  if (e.target.closest('#bulk-map')) { S.onlySel = true; S.view = 'mapa'; MAP.fit = true; renderView(); renderBulk(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open && !dlg.open) closeDrawer(); });
bindMap(); bindMapBar();
window.addEventListener('resize', () => { if (S.view === 'mapa' && $('#map-svg')) { mapMeasure(); mapApply(); } });
window.addEventListener('beforeunload', e => { if (dirty() && !S.sample) { e.preventDefault(); e.returnValue = ''; } });

/* arrastrar y soltar un archivo en cualquier parte de la página */
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
window.addEventListener('dragenter', e => { if (hasFiles(e)) { dragDepth++; $('#dropveil').hidden = false; } });
window.addEventListener('dragleave', e => { if (hasFiles(e) && --dragDepth <= 0) { dragDepth = 0; $('#dropveil').hidden = true; } });
window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
window.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; $('#dropveil').hidden = true; loadFile(e.dataTransfer.files[0]); });

/* arranque: datos de ejemplo hasta que se cargue una planilla */
installData(makeSample(), 'Datos de ejemplo', [], true);
populateFilters(); renderAll();
window.__sra = {S, loadFile, exportData};
})();
</script>
